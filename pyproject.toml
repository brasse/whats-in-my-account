[project]
name = "wima"
version = "0.1.0"
description = "Daily bank balance collection and graph"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
