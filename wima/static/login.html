<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --border: #e1e0da;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --accent: #2a78d6;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border: #333330;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --accent: #3987e5;
      --error: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: min(340px, calc(100vw - 32px));
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 20px; }
  label { display: block; color: var(--text-secondary); font-size: 13px; margin-bottom: 4px; }
  input {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    margin-bottom: 16px;
    background: var(--surface-0);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 9px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .error { color: var(--error); font-size: 13px; margin: 0 0 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>What's in my account</h1>
  <p class="error" __ERROR_HIDDEN__>__ERROR__</p>

  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <input type="hidden" name="next" value="__NEXT__">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
